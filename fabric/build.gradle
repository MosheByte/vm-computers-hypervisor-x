plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

description = project.property('description')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // ./gradlew :fabric:runClient -Phvx.autotest=true runs the automated in-game smoke test
            property('hvx.autotest', (project.findProperty('hvx.autotest') ?: 'false').toString())
            property('hvx.demoworld', (project.findProperty('hvx.demoworld') ?: 'false').toString())
            property('hvx.vmwaretest', (project.findProperty('hvx.vmwaretest') ?: 'false').toString())
            // -Phvx.backendtest=virtualbox|qemu|hostcapture runs the same end-to-end test on another engine
            property('hvx.backendtest', (project.findProperty('hvx.backendtest') ?: '').toString())
            // -Phvx.testimage=<iso> -Phvx.testos=WINDOWS_11 boots that image instead of Tiny Core
            property('hvx.testimage', (project.findProperty('hvx.testimage') ?: '').toString())
            property('hvx.testos', (project.findProperty('hvx.testos') ?: '').toString())
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
