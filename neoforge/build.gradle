plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

description = project.property('description')

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
            // ./gradlew :neoforge:runClient -Phvx.autotest=true runs the automated in-game smoke test
            systemProperty 'hvx.autotest', (project.findProperty('hvx.autotest') ?: 'false').toString()
            // -Phvx.video=true: a scripted scene for a screen recording at 1920x1080
            systemProperty 'hvx.video', (project.findProperty('hvx.video') ?: 'false').toString()
            // -Phvx.videoworld=<save folder>: film in that world, on the machine already running there
            systemProperty 'hvx.videoworld', (project.findProperty('hvx.videoworld') ?: '').toString()
            if (project.findProperty('hvx.video') == 'true') {
                programArguments.addAll('--width', '1920', '--height', '1080')
                // the filmed machine keeps most of the host's memory
                jvmArgument '-Xmx3G'
            }
            else if (project.findProperty('hvx.autotest') == 'true' || project.findProperty('hvx.vmwaretest') == 'true' || project.findProperty('hvx.backendtest')) programArguments.addAll('--width', '1600', '--height', '900')
            // ./gradlew :neoforge:runClient -Phvx.demoworld=true opens a fresh world with the /hvx demo showroom
            systemProperty 'hvx.demoworld', (project.findProperty('hvx.demoworld') ?: 'false').toString()
            // ./gradlew :neoforge:runClient -Phvx.vmwaretest=true boots Tiny Core on VMware inside the showroom
            systemProperty 'hvx.vmwaretest', (project.findProperty('hvx.vmwaretest') ?: 'false').toString()
            // -Phvx.backendtest=virtualbox|qemu|hostcapture runs the same end-to-end test on another engine
            systemProperty 'hvx.backendtest', (project.findProperty('hvx.backendtest') ?: '').toString()
            // -Phvx.testimage=<iso> -Phvx.testos=WINDOWS_11 boots that image instead of Tiny Core
            systemProperty 'hvx.testimage', (project.findProperty('hvx.testimage') ?: '').toString()
            systemProperty 'hvx.testos', (project.findProperty('hvx.testos') ?: '').toString()
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
