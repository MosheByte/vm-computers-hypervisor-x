name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge + Fabric jars and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Boot real Linux on the embedded RISC-V MicroVM
        run: |
          curl -sSL -o /tmp/linux.zip https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip
          unzip -o /tmp/linux.zip -d /tmp/linux
          ./gradlew :common:test -Phvx.bootTest=true -Phvx.testImage=/tmp/linux/Image --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          cp neoforge/build/libs/hypervisorx-neoforge-*.jar dist/
          cp fabric/build/libs/hypervisorx-fabric-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypervisorx-jars
          path: dist/*.jar

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          body_path: CHANGELOG.md

  # releases made with GITHUB_TOKEN don't trigger other workflows, so publish is chained here
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish_mod.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
