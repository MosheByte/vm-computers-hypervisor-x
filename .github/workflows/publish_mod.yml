name: Publish to Modrinth & CurseForge

# Called by "Build & Release" after a v* tag build, or run by hand from the Actions tab
# (pick the tag in "Use workflow from"). A platform is skipped when its token is missing.
# Configure once in Settings -> Secrets and variables -> Actions:
#   secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: MODRINTH_ID (project id/slug), CURSEFORGE_ID (numeric project id)
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (e.g. v1.0.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --stacktrace

      - name: Publish NeoForge build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(sources|dev)).jar
          name: HyperVisor X ${{ inputs.version }} (NeoForge 1.21.1)
          version: ${{ inputs.version }}+neoforge
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

      - name: Publish Fabric build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(sources|dev)).jar
          name: HyperVisor X ${{ inputs.version }} (Fabric 1.21.1)
          version: ${{ inputs.version }}+fabric
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required)
            modmenu(optional)
