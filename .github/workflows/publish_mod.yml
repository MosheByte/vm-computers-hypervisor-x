name: Publish to Modrinth & CurseForge

# Runs when a GitHub release is published (or manually). Configure once in
# Settings -> Secrets and variables -> Actions:
#   secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: MODRINTH_ID (project id/slug), CURSEFORGE_ID (numeric project id)
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --stacktrace

      - name: Publish NeoForge build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(sources|dev)).jar
          name: HyperVisor X ${{ github.ref_name }} (NeoForge 1.21.1)
          version: ${{ github.ref_name }}+neoforge
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

      - name: Publish Fabric build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(sources|dev)).jar
          name: HyperVisor X ${{ github.ref_name }} (Fabric 1.21.1)
          version: ${{ github.ref_name }}+fabric
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required)
            modmenu(optional)
