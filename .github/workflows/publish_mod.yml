name: Publish to Modrinth & CurseForge

# "Build & Release" calls this after a tested v* tag build, and it uploads exactly the jars that
# build made and tested (artifact "hypervisorx-jars"). You can also run it by hand from the Actions
# tab on an existing tag: it rebuilds that tag WITH tests and publishes it.
# No token for a platform = that platform gets skipped. Set these once in
# Settings -> Secrets and variables -> Actions:
#   secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: MODRINTH_ID (project id/slug), CURSEFORGE_ID (numeric project id)
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (e.g. v1.1.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Use the tested jars from the release build
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: hypervisorx-jars
          path: dist

      - uses: actions/setup-java@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Rebuild the tag with tests (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          mkdir -p dist
          cp neoforge/build/libs/hypervisorx-neoforge-*.jar fabric/build/libs/hypervisorx-fabric-*.jar dist/
          rm -f dist/*-sources.jar

      - name: Strip the "v" off the tag
        id: ver
        run: echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Publish NeoForge build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/hypervisorx-neoforge-*.jar
          name: HyperVisor X ${{ steps.ver.outputs.number }} (NeoForge 1.21.1)
          version: ${{ steps.ver.outputs.number }}+neoforge
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

      - name: Publish Fabric build
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/hypervisorx-fabric-*.jar
          name: HyperVisor X ${{ steps.ver.outputs.number }} (Fabric 1.21.1)
          version: ${{ steps.ver.outputs.number }}+fabric
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required)
            modmenu(optional)
